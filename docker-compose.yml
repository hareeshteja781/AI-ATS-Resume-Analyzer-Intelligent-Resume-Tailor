version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: resume-ats-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_ats}
      POSTGRES_USER: ${POSTGRES_USER:-resume_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_app} -d ${POSTGRES_DB:-resume_ats}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resume-ats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-ats-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-resume_ats}
      DATABASE_USER: ${POSTGRES_USER:-resume_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-resume_app_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: resume-ats-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-resume_ats}
      DATABASE_USER: ${POSTGRES_USER:-resume_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-resume_app_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: resume-ats-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
